# SkyNexus: docker compose up --build   then open http://localhost:5173
#
# Settings come from .env (copy .env.example). Defaults run the live feeds.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c work_mem=2MB -c maintenance_work_mem=16MB -c max_connections=20 -c effective_cache_size=64MB -c autovacuum_max_workers=2 -c max_worker_processes=4 -c max_parallel_workers=2
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skynexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skynexus"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - research_artifacts:/app/artifacts
      - ./backups:/app/backups
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/skynexus
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"
      DEMO_DIRECT_LOGIN: ${DEMO_DIRECT_LOGIN:-true}
      ENV: ${ENV:-production}
      DATA_MODE: ${DATA_MODE:-live}
      DEMO_RESET: ${DEMO_RESET:-0}
      LIVE_INGEST: ${LIVE_INGEST:-1}
      LIVE_INGEST_INTERVAL_S: ${LIVE_INGEST_INTERVAL_S:-540}
      RETENTION_DAYS: ${RETENTION_DAYS:-3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      SEVERITY_LOW: ${SEVERITY_LOW:-20}
      SEVERITY_MEDIUM: ${SEVERITY_MEDIUM:-40}
      SEVERITY_HIGH: ${SEVERITY_HIGH:-70}
      FLIGHT_DEVIATION_LIMIT_KM: ${FLIGHT_DEVIATION_LIMIT_KM:-300}
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-5173}:80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  ingestion:
    healthcheck:
      disable: true
    build: ./backend
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - research_artifacts:/app/artifacts
      - ./backups:/app/backups
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/skynexus
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
  analysis:
    healthcheck:
      disable: true
    build: ./backend
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "rq worker research --url redis://redis:6379/0"]
    env_file: .env
    volumes:
      - research_artifacts:/app/artifacts
      - ./backups:/app/backups
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/skynexus
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  research_artifacts:
