services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skynexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skynexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/skynexus
      ENV: development
      # Set to 0 to disable the automatic live-data ingestion loop
      LIVE_INGEST: 1
      LIVE_INGEST_INTERVAL_S: 600

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
